<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="overlay" id="overlay">

    <!-- Círculo de Winrate -->
    <div class="circle-container">

        <div class="circle">

            <div class="percent" id="winrate">
                0%
            </div>

            <div class="label">
                WINRATE
            </div>

        </div>

    </div>


    <!-- Wins y Losses -->
    <div class="stats">

        <div class="stat win">

            <span>🏆 WINS</span>
            <strong id="wins">0</strong>

        </div>


        <div class="stat lose">

            <span>💀 LOSSES</span>
            <strong id="losses">0</strong>

        </div>


    </div>


</div>


<script src="script.js"></script>

<script>
  async function actualizarOverlay() {
    try {
      // Pedimos las estadísticas actualizadas al servidor
      const resStats = await fetch('/stats');
      const stats = await resStats.json();

      // Pedimos la configuración (modo compacto/full/oculto)
      const resSettings = await fetch('/settings');
      const settings = await resSettings.json();

      // Actualizamos los elementos en el HTML por sus IDs
      document.getElementById('wins').innerText = stats.wins;
      document.getElementById('losses').innerText = stats.losses;
      document.getElementById('winrate').innerText = stats.winrate + '%';

      // Visibilidad
      const container = document.getElementById('overlay-container');
      if (container) {
        container.style.display = settings.visible ? 'block' : 'none';
      }

    } catch (error) {
      console.error('Error actualizando el overlay:', error);
    }
  }

  // Ejecutamos la función inmediatamente y luego cada 1 segundo (1000 ms)
  actualizarOverlay();
  setInterval(actualizarOverlay, 1000);
</script>

</body>

</html>
