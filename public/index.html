<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Overlay Stats</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="overlay" class="overlay">
    <div class="stats-row">
        <div class="stat-block">
            <div class="stat-value" id="wins-value">0</div>
            <div class="stat-label">Wins</div>
        </div>
        <div class="divider"></div>
        <div class="stat-block">
            <div class="stat-value" id="losses-value">0</div>
            <div class="stat-label">Losses</div>
        </div>
        <div class="divider"></div>
        <div class="stat-block">
            <div class="stat-value" id="winrate-value">0%</div>
            <div class="stat-label">Winrate</div>
        </div>
    </div>

    <div id="last10-section" class="last10-section">
        <div class="history-row" id="history-row"></div>
        <div class="streak-row" id="streak-row"></div>
    </div>
</div>

<script>
    const overlay = document.getElementById("overlay");
    const winsValue = document.getElementById("wins-value");
    const lossesValue = document.getElementById("losses-value");
    const winrateValue = document.getElementById("winrate-value");
    const last10Section = document.getElementById("last10-section");
    const historyRow = document.getElementById("history-row");
    const streakRow = document.getElementById("streak-row");

    function renderHistory(last10) {
        historyRow.innerHTML = "";

        // Rellena con espacios vacíos a la izquierda si hay menos de 10 partidas
        const faltantes = 10 - last10.length;
        for (let i = 0; i < faltantes; i++) {
            const dot = document.createElement("div");
            dot.className = "game-dot empty";
            historyRow.appendChild(dot);
        }

        last10.forEach(resultado => {
            const dot = document.createElement("div");
            dot.className = "game-dot " + (resultado === "win" ? "win" : "loss");
            dot.textContent = resultado === "win" ? "✓" : "✕";
            historyRow.appendChild(dot);
        });
    }

    function renderStreak(streak) {
        streakRow.className = "streak-row";
        if (!streak || streak.count < 2) {
            streakRow.textContent = "";
            return;
        }

        if (streak.tipo === "win") {
            streakRow.textContent = `🔥 ${streak.count} victorias seguidas`;
            streakRow.classList.add("win-streak");
        } else {
            streakRow.textContent = `❄️ ${streak.count} derrotas seguidas`;
            streakRow.classList.add("loss-streak");
        }
    }

    async function actualizarStats() {
        try {
            const res = await fetch("/stats");
            const data = await res.json();

            winsValue.textContent = data.wins;
            lossesValue.textContent = data.losses;
            winrateValue.textContent = data.winrate + "%";

            renderHistory(data.last10);
            renderStreak(data.streak);
        } catch (e) {
            console.error("Error al obtener /stats:", e);
        }
    }

    async function actualizarSettings() {
        try {
            const res = await fetch("/settings");
            const data = await res.json();

            overlay.classList.toggle("compact", data.mode === "compact");
            overlay.classList.toggle("is-hidden", data.visible === false);
            last10Section.classList.toggle("is-hidden", data.showLast10 !== true);
        } catch (e) {
            console.error("Error al obtener /settings:", e);
        }
    }

    function actualizarTodo() {
        actualizarStats();
        actualizarSettings();
    }

    actualizarTodo();
    setInterval(actualizarTodo, 3000);
</script>

</body>
</html>
