<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Overlay Stats</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="overlay" class="overlay">

    <!-- Modo compact: fila simple, siempre sin círculo ni puntos -->
    <div id="compact-row" class="compact-row is-hidden">
        <div class="stat-block">
            <div class="stat-value" data-field="wins">0</div>
            <div class="stat-label">Wins</div>
        </div>
        <div class="divider"></div>
        <div class="stat-block">
            <div class="stat-value" data-field="losses">0</div>
            <div class="stat-label">Losses</div>
        </div>
        <div class="divider"></div>
        <div class="stat-block">
            <div class="stat-value" data-field="winrate">0%</div>
            <div class="stat-label">Winrate</div>
        </div>
    </div>

    <!-- Modo full, cara A: círculo de winrate + wins/losses apilados -->
    <div id="circle-face" class="circle-face is-hidden">
        <div class="win-circle" id="win-circle">
            <span class="win-circle-text" id="win-circle-text">0%</span>
        </div>
        <div class="stacked-stats">
            <div class="stat-block stacked">
                <div class="stat-value" data-field="wins">0</div>
                <div class="stat-label">Wins</div>
            </div>
            <div class="stat-block stacked">
                <div class="stat-value" data-field="losses">0</div>
                <div class="stat-label">Losses</div>
            </div>
        </div>
    </div>

    <!-- Modo full, cara B: últimos 10 juegos -->
    <div id="last10-face" class="last10-face is-hidden">
        <div class="last10-header">
            <span class="last10-title">Últimos 10 juegos</span>
            <span class="streak-text" id="streak-text"></span>
        </div>
        <div class="history-row" id="history-row"></div>
    </div>

</div>

<script>
    const overlay = document.getElementById("overlay");
    const compactRow = document.getElementById("compact-row");
    const circleFace = document.getElementById("circle-face");
    const last10Face = document.getElementById("last10-face");
    const winCircle = document.getElementById("win-circle");
    const winCircleText = document.getElementById("win-circle-text");
    const historyRow = document.getElementById("history-row");
    const streakText = document.getElementById("streak-text");

    function actualizarValores(data) {
        document.querySelectorAll('[data-field="wins"]').forEach(el => el.textContent = data.wins);
        document.querySelectorAll('[data-field="losses"]').forEach(el => el.textContent = data.losses);
        document.querySelectorAll('[data-field="winrate"]').forEach(el => el.textContent = data.winrate + "%");
    }

    function actualizarCirculo(data) {
        const totalJuegos = data.wins + data.losses;
        const winratePct = parseFloat(data.winrate) || 0;

        if (totalJuegos === 0) {
            winCircle.style.background = "conic-gradient(#4b5563 0% 100%)";
        } else {
            winCircle.style.background =
                `conic-gradient(#34d399 0% ${winratePct}%, #f87171 ${winratePct}% 100%)`;
        }

        winCircleText.textContent = data.winrate + "%";
    }

    function renderHistory(last10) {
        historyRow.innerHTML = "";

        // Rellena con espacios vacíos a la izquierda si hay menos de 10 partidas
        const faltantes = 10 - last10.length;
        for (let i = 0; i < faltantes; i++) {
            const dot = document.createElement("div");
            dot.className = "game-dot empty";
            historyRow.appendChild(dot);
        }

        last10.forEach(resultado => {
            const dot = document.createElement("div");
            dot.className = "game-dot " + (resultado === "win" ? "win" : "loss");
            dot.textContent = resultado === "win" ? "✓" : "✕";
            historyRow.appendChild(dot);
        });
    }

    function renderStreak(streak) {
        streakText.className = "streak-text";
        if (!streak || streak.count < 2) {
            streakText.textContent = "Sin racha";
            return;
        }

        if (streak.tipo === "win") {
            streakText.textContent = `🔥 ${streak.count} victorias seguidas`;
            streakText.classList.add("win-streak");
        } else {
            streakText.textContent = `❄️ ${streak.count} derrotas seguidas`;
            streakText.classList.add("loss-streak");
        }
    }

    async function actualizarStats() {
        try {
            const res = await fetch("/stats");
            const data = await res.json();

            actualizarValores(data);
            actualizarCirculo(data);
            renderHistory(data.last10);
            renderStreak(data.streak);
        } catch (e) {
            console.error("Error al obtener /stats:", e);
        }
    }

    async function actualizarSettings() {
        try {
            const res = await fetch("/settings");
            const data = await res.json();

            overlay.classList.toggle("is-hidden", data.visible === false);

            const esCompact = data.mode === "compact";
            const mostrarUlt10 = data.showLast10 === true;

            // Compact: solo la fila simple, nunca círculo ni puntos
            compactRow.classList.toggle("is-hidden", esCompact === false);

            // Full: círculo o los 10 puntos, nunca ambos, y nunca si es compact
            circleFace.classList.toggle("is-hidden", esCompact || mostrarUlt10);
            last10Face.classList.toggle("is-hidden", esCompact || !mostrarUlt10);
        } catch (e) {
            console.error("Error al obtener /settings:", e);
        }
    }

    function actualizarTodo() {
        actualizarStats();
        actualizarSettings();
    }

    actualizarTodo();
    setInterval(actualizarTodo, 3000);
</script>

</body>
</html>
