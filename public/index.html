<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="overlay" id="overlay">

    <!-- Círculo de Winrate -->
    <div class="circle-container">

        <div class="circle">

            <div class="percent" id="winrate">
                0%
            </div>

            <div class="label">
                WINRATE
            </div>

        </div>

    </div>


    <!-- Wins y Losses -->
    <div class="stats">

        <div class="stat win">

            <span>🏆 WINS</span>
            <strong id="wins">0</strong>

        </div>


        <div class="stat lose">

            <span>💀 LOSSES</span>
            <strong id="losses">0</strong>

        </div>


    </div>


</div>


<script src="script.js"></script>

</body>

</html>
