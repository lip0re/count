<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="overlay" id="overlay">

    <!-- Círculo de Winrate -->
    <div class="circle-container">

        <div class="circle">

            <div class="percent" id="winrate">
                0%
            </div>

            <div class="label">
                WINRATE
            </div>

        </div>

    </div>


    <!-- Wins y Losses -->
    <div class="stats">

        <div class="stat win">

            <span>🏆 WINS</span>
            <strong id="wins">0</strong>

        </div>


        <div class="stat lose">

            <span>💀 LOSSES</span>
            <strong id="losses">0</strong>

        </div>


    </div>


</div>


<script src="script.js"></script>

<script>
  async function actualizarOverlay() {
    try {
      // 1. Obtener Wins y Losses
      const resStats = await fetch('/stats');
      const stats = await resStats.json();

      // 2. Obtener Ajustes de Visibilidad y Modo (!hide, !show, !compact, !full)
      const resSettings = await fetch('/settings');
      const settings = await resSettings.json();

      // --- Actualizar valores en pantalla ---
      const winsEl = document.getElementById('wins');
      const lossesEl = document.getElementById('losses');
      const winrateEl = document.getElementById('winrate');

      if (winsEl) winsEl.innerText = stats.wins;
      if (lossesEl) lossesEl.innerText = stats.losses;
      if (winrateEl) winrateEl.innerText = stats.winrate + '%';

      // --- Aplicar Visibilidad (!hide / !show) ---
      const container = document.getElementById('overlay-container'); // Cambia por el ID de tu contenedor principal
      if (container) {
        if (settings.visible === false) {
          container.style.display = 'none';
        } else {
          container.style.display = 'block';
        }

        // --- Aplicar Modos (!compact / !full) ---
        if (settings.mode === 'compact') {
          container.classList.add('compact');
          container.classList.remove('full');
        } else {
          container.classList.add('full');
          container.classList.remove('compact');
        }
      }

    } catch (error) {
      console.error('Error al actualizar overlay:', error);
    }
  }

  <!-- Asegúrate de tener id="overlay-container" en la etiqueta envolvente -->
<div id="overlay-container">
    <div>Victorias: <span id="wins">0</span></div>
    <div>Derrotas: <span id="losses">0</span></div>
    <div>Winrate: <span id="winrate">0%</span></div>
</div>


  // Actualiza inmediatamente y luego cada 1 segundo
  actualizarOverlay();
  setInterval(actualizarOverlay, 1000);
</script>

</body>

</html>
